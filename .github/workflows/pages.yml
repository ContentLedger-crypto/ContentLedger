# Сайт проекту на GitHub Pages: лендінг у корені, дашборд видавця в /app/.
#   https://contentledger-crypto.github.io/ContentLedger/      apps/landing (статика, без збірки)
#   https://contentledger-crypto.github.io/ContentLedger/app/  apps/web
#
# Адреса шлюзу — одна, VITE_API_URL з repository Variables: її читає збірка
# дашборда і її ж підставляє лендінгу крок складання. Без змінної дашборд —
# прев'ю на зразкових числах, а лендінг лишає вшитий батч без живого рядка.
#
# Rust тут не потрібен: IDL лежить копією в packages/chain і збирається з web.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Другий push не обганяє першого: деплої йдуть по черзі, а не паралельно.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Без `version:` навмисно — те саме, що в ci.yml: версію читає
      # packageManager із package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # Червоний гейт не публікується: Pages показує лише те, що пройшло
      # ту саму команду, що й локально.
      - run: pnpm gate

      - run: pnpm --filter @contentledger/web build
        env:
          # Проектний сайт живе під /<repo>/, а дашборд — у його /app/. Роутера
          # в apps/web немає (один екран), тож 404.html для глибоких шляхів не треба.
          PAGES_BASE: /${{ github.event.repository.name }}/app/
          # The hosted gateway, from repository Variables. Unset, the build is the
          # sign-in-free preview on sample figures, and the page says so itself.
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      # Pages вмикає власник репозиторію один раз: Settings → Pages → Source:
      # "GitHub Actions". GITHUB_TOKEN сам сайт створити не може (перший прогін
      # у RunwayLadder упав із "Resource not accessible by integration"), тож
      # крок лише читає наявну конфігурацію.
      - uses: actions/configure-pages@v5

      # Лендінг — у корінь як є, дашборд — у app/. Плейсхолдер адреси шлюзу
      # лишається, коли змінна не задана: скрипт сторінки його розпізнає.
      - name: Assemble the site
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          mkdir -p dist
          cp -r apps/landing/. dist/
          cp -r apps/web/dist dist/app
          if [ -n "$VITE_API_URL" ]; then
            sed -i "s|%VITE_API_URL%|${VITE_API_URL}|" dist/index.html
          fi
          grep -c 'name="contentledger-api"' dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
