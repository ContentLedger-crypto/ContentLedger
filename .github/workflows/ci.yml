name: ci

on: [push, pull_request]

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No `version:` on purpose: pnpm/action-setup fails with "Multiple versions
      # of pnpm specified" when package.json has a packageManager field. That field
      # is more precise (9.15.0), and corepack reads the same one locally.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The same command as locally: two descriptions of the gate drift apart, one does not.
      - run: pnpm gate

  # A job of its own because it alone needs the whole history: the published history
  # is what the sweep answers for, and the other jobs should not fetch it for nothing.
  # The `ci` mode runs every structural pattern with its self-check; only the
  # personal-data list is absent, since it lives outside the repository on purpose.
  traces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: No build-machine traces in the history
        run: bash scripts/trace-sweep.sh ci

  program:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/program
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            ~/.local/share/solana
            packages/program/target
          key: solana-${{ hashFiles('packages/program/Cargo.lock', 'packages/program/rust-toolchain.toml', 'packages/program/Anchor.toml') }}
          restore-keys: solana-

      - name: Agave
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.2.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: anchor-cli
        # From the root, not packages/program: rust-toolchain.toml there pins
        # 1.97.1 for the program, and building anchor-cli with it too is a needless coupling.
        working-directory: .
        run: |
          if ! command -v anchor >/dev/null; then
            # anchor-cli pulls in Ledger wallet support → hidapi → the system
            # libudev, which the ubuntu-latest image lacks, and cargo install fails
            # in the hidapi build script. pkg-config needs no install — it is already there.
            sudo apt-get update && sudo apt-get install -y libudev-dev
            cargo install anchor-cli --version 0.32.1 --locked
          fi

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: anchor build

      # The IDL in packages/chain is a copy, because target/ is gitignored and the TS
      # job has neither a Rust toolchain nor 18 minutes to build the program. It can
      # only be checked here, right after anchor build: a stale copy becomes a red
      # CI rather than a transaction with the wrong bytes on devnet.
      - name: IDL matches the program
        working-directory: .
        run: node packages/chain/scripts/sync-idl.mjs --check

      # Only after anchor build: mollusk loads contentledger.so from SBF_OUT_DIR,
      # and before the build it does not exist.
      - run: SBF_OUT_DIR=$PWD/target/deploy cargo test --manifest-path programs/contentledger/Cargo.toml
