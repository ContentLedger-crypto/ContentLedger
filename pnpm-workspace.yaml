packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"
  # Наскрізні прогони віх (m1…m4) ходять у devnet: інші залежності й інші
  # таймаути, ніж у модульних тестів застосунків, тож окремий пакет.
  - "tests"

# Трійка Solana-версій пиняється в одному місці й точно, без `^`.
#
# `@coral-xyz/anchor` 0.32.1 має peer `@solana/web3.js ^1.69`, тож гілка
# `@solana/kit` сюди не підходить узагалі; `@solana/spl-token` 0.4.15 просить
# `^1.95.5` того самого web3.js. Каталог робить версію в усіх пакетах монорепо
# буквально однією, а не «сумісною»: дві копії web3.js у дереві дають два різні
# класи `PublicKey`, і `instanceof` починає брехати в рантаймі.
#
# Версія anchor тут мусить збігатися з `anchor_version` у `Anchor.toml`
# (0.32.1) — IDL, згенерований CLI, читає саме цей кодек.
catalog:
  "@coral-xyz/anchor": 0.32.1
  "@solana/web3.js": 1.98.4
  "@solana/spl-token": 0.4.15
